<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#F3F2F7;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body.profile{background:#FFFFFF}
button{font:inherit;color:inherit}
#app{position:absolute;left:0;top:0;width:834px;height:1194px;overflow:hidden;transform-origin:0 0;font-family:Rubik,system-ui,sans-serif;color:#111;background:#F3F2F7}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none}

/* ---------- background: falling blurred followers ---------- */
#bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;background-image:radial-gradient(#DEDCE7 1.4px,transparent 1.4px);background-size:28px 28px}
#bg[hidden]{display:none}
.fall{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;will-change:transform;animation:fall linear infinite}
.fall .c{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center}
.fall .c svg{width:58%;height:58%}
.fall .plus{position:absolute;right:-2px;bottom:-2px;width:34%;height:34%;border-radius:50%;background:#FE2C55;border:2px solid #fff;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}
.fall .lbl{padding:2px 8px;border-radius:6px;background:#111;color:#fff;font-weight:700}
@keyframes fall{0%{transform:translate3d(0,-240px,0)}100%{transform:translate3d(0,1440px,0)}}

/* ---------- shared app UI ---------- */
.glitch{margin:0;font-size:96px;font-weight:900;line-height:.95;letter-spacing:-1px;text-transform:uppercase;text-shadow:-4px -3px 0 #25F4EE,4px 3px 0 #FE2C55}
.sub{margin:0;font-size:24px;font-weight:500;color:#4A4752}
.head{display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.topbar{display:flex;align-items:center;justify-content:space-between}
.back{width:64px;height:64px;border-radius:18px;border:3px solid #111;background:#fff;box-shadow:4px 4px 0 #111;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chip{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:999px;border:3px solid #111;background:#fff;font-size:20px;font-weight:700}
.chip img{width:36px;height:36px;object-fit:contain;display:block}
.big{height:104px;flex-shrink:0;border:3px solid #111;border-radius:26px;font-family:Rubik,system-ui,sans-serif;font-size:34px;font-weight:900;text-transform:uppercase;background:#FE2C55;color:#fff;box-shadow:6px 6px 0 #111;cursor:pointer}
.big:disabled{background:#E6E4EC;color:#6B6872;box-shadow:none;cursor:not-allowed}
.grow{flex-grow:1}

/* platform */
#s-platform{padding:120px 72px 72px;gap:48px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.pcard{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:28px;text-align:left;border:3px solid #111;border-radius:26px;cursor:pointer;background:#fff;box-shadow:6px 6px 0 #111;transition:transform .12s,box-shadow .12s}
.pcard.sel{background:#FFE3EA;box-shadow:8px 8px 0 #FE2C55;transform:translate(-2px,-2px)}
.pcard .logo{width:84px;height:84px;display:flex;align-items:center;justify-content:center}
.pcard .logo img{max-width:84px;max-height:84px;display:block}
.pcard .name{font-size:32px;font-weight:900}
.pcard .hint{font-size:18px;font-weight:500;color:#4A4752}

/* nickname */
#s-nick{padding:56px 72px 72px;gap:40px}
#s-nick .head{padding-top:80px}
.field-l{font-size:20px;font-weight:700}
.field{display:flex;align-items:center;gap:8px;height:96px;padding:0 12px 0 28px;border:3px solid #111;border-radius:22px;background:#fff;box-shadow:6px 6px 0 #111}
.field .at{font-size:40px;font-weight:900;color:#FE2C55}
.field input{flex-grow:1;min-width:0;border:0;outline:none;background:transparent;font-family:Rubik,system-ui,sans-serif;font-size:36px;font-weight:700;color:#111;-webkit-user-select:text;user-select:text}
.paste{height:64px;padding:0 24px;flex-shrink:0;border:3px solid #111;border-radius:16px;background:#111;color:#fff;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px}

/* tapper */
#s-tap{padding:56px 56px 64px;gap:28px}
.pcard2{background:#fff;border:3px solid #111;border-radius:26px;box-shadow:6px 6px 0 #111;padding:28px 32px;display:flex;flex-direction:column;align-items:center;gap:20px}
.ava{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #111;box-shadow:-4px -3px 0 #25F4EE,4px 3px 0 #FE2C55}
.nickbig{font-size:36px;font-weight:900;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats3{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:center}
.stats3>div{padding:14px 4px;display:flex;flex-direction:column;gap:4px}
.stats3 .n{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}
.stats3 .l{font-size:18px;font-weight:500;color:#4A4752}
.stats3 .hl{background:#FFE3EA;border:3px solid #111;border-radius:16px}
.stats3 .hl .l{font-weight:700;color:#111}
.live{color:#FE2C55!important;text-shadow:0 0 14px rgba(254,44,85,.5)}
.tapzone{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.tapwrap{position:relative;width:460px;height:440px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;left:50px;top:40px;width:360px;height:360px;border-radius:50%;border:3px dashed #111;opacity:.25}
#tapbtn{width:320px;height:320px;border-radius:50%;border:4px solid #111;background:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;box-shadow:-9px -7px 0 #25F4EE,9px 7px 0 #FE2C55,0 0 0 16px rgba(254,44,85,.10);transition:transform .06s ease-out;will-change:transform}
#tapbtn:active,#tapbtn.down{transform:scale(.93)}
#tapbtn img{width:150px;height:auto;display:block;pointer-events:none}
.pop{position:absolute;pointer-events:none;white-space:nowrap;font-size:44px;font-weight:900;color:#111;text-shadow:-2px -2px 0 #25F4EE,2px 2px 0 #FE2C55;opacity:0;will-change:transform,opacity}
.pop.a{animation:popA .9s cubic-bezier(.2,.7,.3,1) forwards}
.pop.b{animation:popB .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes popA{0%{opacity:1;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-24px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180px) scale(1.25)}}
@keyframes popB{0%{opacity:1;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-24px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180px) scale(1.25)}}
.taphint{margin:0;font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:2px}

/* ---------- profile scene (plain native look) ---------- */
#s-profile{background:#fff;font-family:Inter,-apple-system,'Helvetica Neue',sans-serif;color:#161823}
.pf-top{height:120px;padding:0 40px;display:flex;align-items:center;justify-content:flex-end;gap:36px}
.pf-row{padding:0 40px;display:flex;align-items:flex-start;gap:24px}
.pf-info{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.pf-name{display:flex;align-items:center;gap:12px;font-size:64px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.pf-handle{font-size:28px;font-weight:500;color:#8A8B91}
.pf-stats{display:flex;gap:56px;margin-top:36px}
.pf-stats>div{display:flex;flex-direction:column;gap:4px}
.pf-stats .n{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:#161823}
.pf-stats .l{font-size:26px;color:#8A8B91}
.pf-ava{width:220px;height:220px;flex-shrink:0;margin-top:16px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;overflow:hidden}
.pf-ava img{width:220px;height:220px;border-radius:50%;object-fit:cover;display:block}
.pf-bio{display:inline-flex;align-items:center;gap:12px;padding:18px 30px;border-radius:999px;background:#F1F1F2;font-size:26px;font-weight:600}
.pf-tabs{margin-top:44px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid #E3E3E4}
.pf-tabs>div{display:flex;justify-content:center;padding:20px 0}
.pf-tabs .on{border-bottom:3px solid #161823;margin:0 40px -1px;padding-bottom:18px}
.pf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding-top:3px}
.pf-post{position:relative;aspect-ratio:3/4;overflow:hidden;background:#161823}
.pf-post img{width:100%;height:100%;object-fit:cover;display:block}
.pf-views{position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pf-views.live{color:#FF4D6D!important}
#bubble{position:absolute;right:24px;bottom:132px;background:#FE2C55;color:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(254,44,85,.35);padding:14px 22px;display:flex;align-items:center;gap:24px;white-space:nowrap;font-variant-numeric:tabular-nums}
#bubble[hidden]{display:none}
#bubble span{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:700}
#bubble .tail{position:absolute;right:204px;bottom:-10px;width:22px;height:22px;background:#FE2C55;transform:rotate(45deg)}
.nav{height:118px;flex-shrink:0;background:#fff;border-top:1px solid #E3E3E4;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding-bottom:14px}
.nav>*{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:18px;font-weight:500;border:0;background:transparent;padding:0;font-family:Inter,-apple-system,sans-serif;color:#161823}
.nav button{cursor:pointer}
.nav .plusbtn{width:92px;height:60px;border-radius:16px;background:#161823;display:flex;align-items:center;justify-content:center}
.inbox-ic{position:relative;display:flex}
#badge{position:absolute;left:24px;top:-10px;min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:#FE2C55;color:#fff;border:2px solid #fff;font-size:16px;font-weight:700;line-height:26px;white-space:nowrap;font-variant-numeric:tabular-nums}
#badge[hidden]{display:none}
#badge.glow{box-shadow:0 0 12px rgba(254,44,85,.8)}
</style>
</head>
<body>
<div id="app">
  <div id="bg" aria-hidden="true"></div>

  <!-- 1. PLATFORM -->
  <section class="screen" id="s-platform">
    <div class="head">
      <h1 class="glitch">Pick your<br>platform</h1>
      <p class="sub">Where should we send your followers?</p>
    </div>
    <div class="grid2" id="platforms"></div>
    <div class="grow"></div>
    <button type="button" class="big" id="btn-next" disabled>Next</button>
  </section>

  <!-- 2. USERNAME -->
  <section class="screen" id="s-nick" hidden>
    <div class="topbar">
      <button type="button" class="back" data-go="platform" aria-label="Back"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="chip"><img class="p-logo" alt="">
        <span class="p-name"></span></span>
    </div>
    <div class="head">
      <h1 class="glitch">Enter your<br>username</h1>
      <p class="sub">The account that gets the followers</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <label for="nick-input" class="field-l">Username</label>
      <div class="field">
        <span class="at">@</span>
        <input id="nick-input" type="text" placeholder="username" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="paste" id="btn-paste"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Paste</button>
      </div>
    </div>
    <div class="grow"></div>
    <button type="button" class="big" id="btn-go" disabled>Let's go</button>
  </section>

  <!-- 3. TAPPER -->
  <section class="screen" id="s-tap" hidden>
    <div class="topbar">
      <button type="button" class="back" data-go="nick" aria-label="Back"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="chip"><img class="p-logo" alt=""><span class="p-name"></span></span>
    </div>

  // ---------------- helpers ----------------
  var $ = function (id) { return document.getElementById(id); };
  var $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };
  function fmt(n) {
    n = Math.round(n);
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.0', '') + 'M';
    if (n >= 1e5) return (n / 1e3).toFixed(1).replace('.0', '') + 'K';
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function randomNick() {
    var a = ['pink','neon','lazy','tiny','wild','soft','fizzy','lucky','sunny','cosmic','sleepy','spicy'];
    var b = ['cat','fox','bean','wave','moon','bunny','pixel','berry','star','vibe','mochi','kitty'];
    var p = function (l) { return l[Math.floor(Math.random() * l.length)]; };
    return p(a) + '.' + p(b) + (10 + Math.floor(Math.random() * 9990));
  }

  // ---------------- fit 834x1194 design to any screen ----------------
  var app = $('app');
  function fit() {
    var s = Math.min(window.innerWidth / 834, window.innerHeight / 1194);
    var x = (window.innerWidth - 834 * s) / 2, y = (window.innerHeight - 1194 * s) / 2;
    app.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();

  // ---------------- state ----------------
  var S;
  function reset() {
    S = {
      screen: 'platform', platform: null, nick: '',
      following: START.following, followers: START.followers, likes: START.likes,
      pending: 0, pendingL: 0, dispF: START.followers,
      gF: 0, gL: 0, gV: 0
    };
  }
  reset();

  // ---------------- background ----------------
  (function buildBg() {
    var colors = ['#4A90F0','#8B3FD9','#E83E8C','#2DBE60','#F47C2B','#22B8CF','#5B67C4'];
    var labels = ['+1.2K','+350','+2.9K','+780','+4.1K','+520','+1.7K'];
    var html = '';
    for (var i = 0; i < 16; i++) {
      var size = 54 + Math.round(Math.random() * 64), depth = (size - 54) / 64;
      var dur = 9 + (1 - depth) * 9 + Math.random() * 3;
      html += '<div class="fall" style="left:' + Math.round(10 + Math.random() * 770) + 'px;opacity:' + (0.32 + depth * 0.18).toFixed(2) +
        ';filter:blur(' + (2 + depth * 3).toFixed(1) + 'px);animation-duration:' + dur.toFixed(1) + 's;animation-delay:-' + (Math.random() * dur).toFixed(1) + 's">' +
        '<div class="c" style="width:' + size + 'px;height:' + size + 'px;background:' + colors[i % colors.length] + '">' +
        '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8.5" r="4.5"/><path d="M3.5 22c0-4.6 3.8-7.6 8.5-7.6s8.5 3 8.5 7.6z"/></svg><span class="plus">+</span></div>' +
        '<span class="lbl" style="font-size:' + Math.round(12 + depth * 6) + 'px">' + labels[i % labels.length] + '</span></div>';
    }
    $('bg').innerHTML = html;
  })();

  // ---------------- screens ----------------
  function show(name) {
    S.screen = name;
    ['platform', 'nick', 'tap', 'profile'].forEach(function (n) { $('s-' + n).hidden = n !== name; });
    $('bg').hidden = name === 'profile';
    document.body.classList.toggle('profile', name === 'profile');
    app.style.background = name === 'profile' ? '#FFFFFF' : '#F3F2F7';
    var p = PLATFORMS.filter(function (x) { return x.id === S.platform; })[0];
    $$('.p-logo').forEach(function (el) { if (p) el.src = p.logo; });
    $$('.p-name').forEach(function (el) { el.textContent = p ? p.name : ''; });
    $$('.v-nick').forEach(function (el) { el.textContent = S.nick; });
  }

  // 1. platform
  var pWrap = $('platforms');
  PLATFORMS.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pcard'; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="logo"><img alt="" src="' + p.logo + '"></span><span class="name">' + p.name + '</span><span class="hint">' + p.hint + '</span>';
    b.addEventListener('click', function () {
      S.platform = p.id;
      $$('.pcard').forEach(function (c) { c.classList.remove('sel'); c.setAttribute('aria-pressed', 'false'); });
      b.classList.add('sel'); b.setAttribute('aria-pressed', 'true');
      $('btn-next').disabled = false;
    });
    pWrap.appendChild(b);
  });
  $('btn-next').addEventListener('click', function () {
    if (!S.platform) return;
    S.nick = ''; $('nick-input').value = ''; $('btn-go').disabled = true;
    show('nick');
  });
  $$('[data-go]').forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-go')); }); });

  // 2. username
  var nickInput = $('nick-input');
  nickInput.addEventListener('input', function () {
    S.nick = nickInput.value.replace(/^@+/, '').replace(/\s/g, '');
    if (nickInput.value !== S.nick) nickInput.value = S.nick;
    $('btn-go').disabled = !S.nick;
  });
  $('btn-paste').addEventListener('click', function () {
    S.nick = randomNick(); nickInput.value = S.nick; $('btn-go').disabled = false;
  });
  $('btn-go').addEventListener('click', function () {
    if (!S.nick) return;
    S.pending = 0; S.pendingL = 0; S.dispF = S.followers;
    renderTap(); show('tap');
  });

  // 3. tapper
  var tFollowers = $('t-followers'), tLikes = $('t-likes'), sendBtn = $('btn-send');
  function renderTap() {
    $('t-following').textContent = fmt(S.following);
    tFollowers.textContent = fmt(S.dispF);
    tLikes.textContent = fmt(S.likes + S.pendingL);
    tFollowers.classList.toggle('live', S.dispF < S.followers + S.pending);
    sendBtn.disabled = S.pending <= 0;
  }

  // follower counter ticks toward target (one rAF loop, no per-tap timers)
  var tickRaf = 0, lastTick = 0;
  function tickLoop(t) {
    tickRaf = 0;
    var target = S.followers + S.pending;
    if (S.dispF >= target) { renderTap(); return; }
    if (t - lastTick >= 35) {
      lastTick = t;
      S.dispF = Math.min(target, S.dispF + Math.max(37, Math.ceil((target - S.dispF) / 7)));
      tFollowers.textContent = fmt(S.dispF);
    }
    tFollowers.classList.add('live');
    tickRaf = requestAnimationFrame(tickLoop);
  }
  function startTick() { if (!tickRaf) tickRaf = requestAnimationFrame(tickLoop); }
  function stopTick() { if (tickRaf) cancelAnimationFrame(tickRaf); tickRaf = 0; }

  // pop labels: fixed pool, alternating animation class restarts the CSS animation without reflow
  var POOL = 10, pops = [], popN = 0, tapwrap = $('tapwrap');
  for (var i = 0; i < POOL; i++) { var sp = document.createElement('span'); sp.className = 'pop'; tapwrap.appendChild(sp); pops.push(sp); }

  function doTap() {
    var gain = GAIN_MIN + Math.floor(Math.pow(Math.random(), 1.5) * (GAIN_MAX - GAIN_MIN + 1));
    var lg = Math.round(gain * (1.4 + Math.random() * 1.6));
    S.pending += gain; S.pendingL += lg;
    var n = popN++, el = pops[n % POOL];
    el.textContent = '+' + fmt(gain);
    el.style.left = Math.round(120 + Math.random() * 220) + 'px';
    el.style.top = Math.round(50 + Math.random() * 130) + 'px';
    el.className = 'pop ' + (Math.floor(n / POOL) % 2 ? 'a' : 'b');
    tLikes.textContent = fmt(S.likes + S.pendingL);
    sendBtn.disabled = false;
    startTick();
  }
  var tapBtn = $('tapbtn');
  tapBtn.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    tapBtn.classList.add('down'); doTap();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { tapBtn.addEventListener(ev, function () { tapBtn.classList.remove('down'); }); });
  tapBtn.addEventListener('click', function (e) { if (e.detail === 0) doTap(); }); // keyboard
  tapBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // 4. account: counters tick red, inbox notification ticks
  var profRaf = 0, profStart = 0;
  var pfF = $('pf-followers'), pfL = $('pf-likes'), pfV = $('pf-views'), pfVn = $('pf-views-n');
  var bubble = $('bubble'), badge = $('badge'), nF = $('n-f'), nL = $('n-l'), nV = $('n-v');
  function renderProfile(k) {
    var live = k < 1;
    pfF.textContent = fmt(S.followers + S.gF * k);
    pfL.textContent = fmt(S.likes + S.gL * k);
    pfVn.textContent = fmt(S.gV * k);
    nF.textContent = fmt(S.gF * k); nL.textContent = fmt(S.gL * k); nV.textContent = fmt(S.gV * k);
    badge.textContent = fmt((S.gF + S.gL + S.gV) * k);
    pfF.classList.toggle('live', live); pfL.classList.toggle('live', live); pfV.classList.toggle('live', live);
    badge.classList.toggle('glow', live);
  }
  function profLoop(t) {
    var x = Math.min(1, (t - profStart) / PROFILE_TICK_MS);
    var k = 1 - Math.pow(1 - x, 2);
    renderProfile(k);
    if (x < 1) { profRaf = requestAnimationFrame(profLoop); return; }
    profRaf = 0; commitProfile();
  }
  function commitProfile() {
    if (!S.gF) return;
    S.followers += S.gF; S.likes += S.gL;
    var gV = S.gV;
    S.gF = 0; S.gL = 0;
    S.gV = gV; // keep views on the post
    S.pending = 0; S.pendingL = 0; S.dispF = S.followers;
    pfF.textContent = fmt(S.followers); pfL.textContent = fmt(S.likes);
    pfF.classList.remove('live'); pfL.classList.remove('live'); pfV.classList.remove('live'); badge.classList.remove('glow');
  }
  function stopProfile() { if (profRaf) cancelAnimationFrame(profRaf); profRaf = 0; }

  sendBtn.addEventListener('click', function () {
    if (S.pending <= 0) return;
    stopTick();
    S.gF = S.pending; S.gL = S.pendingL;
    S.gV = S.pending * 9 + Math.floor(Math.random() * S.pending * 4);
    $('pf-display').textContent = S.nick.split(/[._]/)[0].replace(/^./, function (c) { return c.toUpperCase(); });
    $('pf-following').textContent = fmt(S.following);
    bubble.hidden = false; badge.hidden = false;
    renderProfile(0);
    show('profile');
    stopProfile(); profStart = performance.now(); profRaf = requestAnimationFrame(profLoop);
  });

  // Home -> back to tapper (keeps the boosted numbers)
  $('btn-home').addEventListener('click', function () {
    stopProfile(); commitProfile();
    S.gV = 0; bubble.hidden = true; badge.hidden = true;
    S.pending = 0; S.pendingL = 0; S.dispF = S.followers;
    renderTap(); show('tap');
  });

  // Avatar on the account -> restart the app
  $('btn-restart').addEventListener('click', function () {
    stopProfile(); stopTick(); reset();
    bubble.hidden = true; badge.hidden = true;
    nickInput.value = ''; $('btn-go').disabled = true; $('btn-next').disabled = true;
    $$('.pcard').forEach(function (c) { c.classList.remove('sel'); c.setAttribute('aria-pressed', 'false'); });
    pops.forEach(function (p) { p.className = 'pop'; });
    show('platform');
  });

  show('platform');
})();
</script>
</body>
</html>
